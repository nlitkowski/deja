name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloudflare-env:
        description: Cloudflare environment for the API
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  pages: write
  id-token: write

env:
  API_URL: https://deja-api.litkowski.com

jobs:
  # Records French texts that have no recording yet (usually none: `npm run tts` is run locally before committing),
  # uploads them to R2 and commits the manifest. Later jobs build that commit, so the manifest test sees it.
  audio:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    concurrency:
      group: audio
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only loads the content when nothing is missing; the keys are used only when something is.
      - run: npm run tts
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # A push with GITHUB_TOKEN starts no new workflow run, so this run deploys the commit itself.
      - id: commit
        run: |
          if git diff --quiet -- content/_audio/manifest.json; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record audio for new content" -- content/_audio/manifest.json
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Both deploys wait for this, so a failing check ships nothing.
  check:
    needs: audio
    # Runs after `audio`, or without it on a manual (staging) run.
    if: ${{ !cancelled() && needs.audio.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.audio.outputs.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # App, Worker and validation of every content pack.
      - run: npm test

  # The API at deja-api.litkowski.com, with D1 migrations applied before the new code goes live.
  api:
    needs: [audio, check]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-${{ inputs.cloudflare-env || 'production' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_FLAG: ${{ inputs.cloudflare-env == 'staging' && '--env=staging' || '--env=' }}
      DATABASE: ${{ inputs.cloudflare-env == 'staging' && 'deja-staging' || 'deja' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.audio.outputs.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx wrangler d1 migrations apply $DATABASE --remote $ENV_FLAG

      - run: npx wrangler deploy $ENV_FLAG

  # The app at deja.litkowski.com (GitHub Pages, custom domain set in the repository's Pages settings).
  pages-build:
    needs: [audio, check]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.audio.outputs.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vite build
        env:
          BASE_PATH: /
          VITE_API_URL: ${{ env.API_URL }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
