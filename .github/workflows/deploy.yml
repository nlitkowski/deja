name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloudflare-env:
        description: Cloudflare environment
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # deja.litkowski.com: the app and the /api Worker, with D1 migrations applied first.
  cloudflare:
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-${{ inputs.cloudflare-env || 'production' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV_FLAG: ${{ inputs.cloudflare-env == 'staging' && '--env=staging' || '--env=' }}
      DATABASE: ${{ inputs.cloudflare-env == 'staging' && 'deja-staging' || 'deja' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `build` also runs the tests, including validation of every content pack.
      - run: npm run build

      - run: npx wrangler d1 migrations apply $DATABASE --remote $ENV_FLAG

      - run: npx wrangler deploy $ENV_FLAG

  # The old address stays up until progress has been moved to deja.litkowski.com: data is stored per address.
  pages-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
