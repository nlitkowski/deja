<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#faf7f2" />
    <title>Français</title>
    <script>
      // Applies a chosen theme before the first paint (no flash); `system` leaves it to prefers-color-scheme. Keep in sync with src/theme.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('revision-francaise:state')).settings.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
