<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#faf7f2" />
    <title>Déjà</title>
    <meta name="description" content="Déjà : révisions de français A1–A2, Édito et connecteurs." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS keeps a home-screen icon by URL: bump ?v= whenever apple-touch-icon.png changes. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <script>
      // Applies the saved theme before the first paint (no flash); `system` leaves the mode to prefers-color-scheme.
      // Keep in sync with src/theme.ts. `theme` is the pre-v4 name of `colorMode`.
      try {
        var saved = localStorage.getItem('deja:state') || localStorage.getItem('revision-francaise:state');
        var settings = JSON.parse(saved).settings;
        var mode = settings.colorMode || settings.theme;
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
        if (settings.palette) document.documentElement.dataset.palette = settings.palette;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
